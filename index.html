<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZL1SGS · Emergency & Touring Info</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root {
    --red:#D0021B; --red-bg:#FFF5F5; --amber:#F5A623;
    --green:#2E7D32; --green-bg:#F1F8F1;
    --ink:#1A1A1A; --mid:#555; --rule:#E0E0E0;
    --page:#F8F7F4; --white:#FFFFFF;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--page);color:var(--ink);min-height:100vh;}
  .site-header{background:var(--ink);color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .callsign{font-family:var(--mono);font-size:1.1rem;font-weight:700;letter-spacing:.08em;color:var(--amber);}
  .header-sub{font-size:.75rem;color:#aaa;font-family:var(--mono);}
  .sos-badge{background:var(--red);color:white;font-family:var(--mono);font-weight:700;font-size:.8rem;padding:4px 10px;letter-spacing:.1em;border-radius:2px;flex-shrink:0;}
  .container{max-width:680px;margin:0 auto;padding:0 16px 48px;}
  .section-label{font-family:var(--mono);font-size:.65rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mid);padding:20px 0 8px;border-bottom:2px solid var(--ink);margin-bottom:12px;}

  /* highlight field (blood type etc) */
  .field-highlight{background:var(--red-bg);border-left:4px solid var(--red);padding:14px 16px;margin-bottom:8px;border-radius:0 4px 4px 0;}
  .field-highlight .fl{font-family:var(--mono);font-size:.65rem;font-weight:700;letter-spacing:.15em;color:var(--red);text-transform:uppercase;margin-bottom:4px;}
  .field-highlight .fv{font-family:var(--mono);font-size:1.3rem;font-weight:700;}

  /* grid of normal fields */
  .fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .field-cell{background:var(--white);border:1px solid var(--rule);padding:11px 13px;border-radius:4px;}
  .field-cell .fl{font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.15em;color:var(--mid);text-transform:uppercase;margin-bottom:3px;}
  .field-cell .fv{font-family:var(--mono);font-size:.88rem;font-weight:600;color:var(--ink);}
  .field-cell.full{grid-column:1/-1;}

  /* ICE */
  .ice-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .ice-item{background:var(--white);border:1px solid var(--rule);border-radius:4px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .ice-item .ice-label{font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.15em;color:var(--red);text-transform:uppercase;margin-bottom:2px;}
  .ice-item .ice-name{font-weight:600;font-size:.95rem;}
  .ice-item .ice-rel{font-size:.75rem;color:var(--mid);}
  .ice-item .ice-phone{font-family:var(--mono);font-size:.82rem;font-weight:600;color:var(--ink);margin-top:3px;}
  .ice-item .ice-email{font-family:var(--mono);font-size:.78rem;color:var(--mid);margin-top:2px;}
  .ice-call{background:var(--ink);color:white;font-family:var(--mono);font-size:.85rem;font-weight:600;padding:8px 14px;border-radius:3px;text-decoration:none;white-space:nowrap;flex-shrink:0;}
  .ice-call:hover{background:var(--red);}

  /* status */
  .status-bar{background:var(--green-bg);border-left:4px solid var(--green);padding:14px 16px;border-radius:0 4px 4px 0;margin-bottom:10px;}
  .status-bar .sl{font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.15em;color:var(--green);text-transform:uppercase;margin-bottom:4px;}
  .status-bar .sv{font-family:var(--mono);font-size:1rem;font-weight:600;}
  .status-bar .su{font-size:.7rem;color:var(--mid);margin-top:4px;}
  .plan-block{background:var(--white);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;margin-bottom:10px;}
  .plan-block .pl{font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.15em;color:var(--mid);text-transform:uppercase;margin-bottom:8px;}
  .plan-block .pv{font-size:.9rem;line-height:1.55;}
  .trail-log{background:var(--white);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin-bottom:10px;}
  .trail-log .tl-hdr{font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.15em;color:var(--mid);text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--page);}
  .trail-entry{display:flex;gap:12px;align-items:baseline;padding:8px 14px;border-bottom:1px solid var(--rule);font-size:.85rem;}
  .trail-entry:last-child{border-bottom:none;}
  .trail-date{font-family:var(--mono);font-size:.7rem;color:var(--mid);white-space:nowrap;flex-shrink:0;min-width:80px;}
  .trail-place{color:var(--ink);font-weight:500;}

  .loading{color:var(--mid);font-family:var(--mono);font-size:.8rem;padding:8px 0;}
  .site-footer{text-align:center;font-family:var(--mono);font-size:.65rem;color:#bbb;padding:24px 16px 16px;}
  @media(max-width:400px){.fields-grid{grid-template-columns:1fr;}.ice-item{flex-direction:column;align-items:flex-start;}.ice-call{width:100%;text-align:center;}}
</style>
</head>
<body>
<header class="site-header">
  <div>
    <div class="callsign" id="h-callsign">Emergency Information</div>
  </div>
  <div class="sos-badge">EMERGENCY INFO</div>
</header>

<div class="container" id="main-content">
  <div class="loading" style="padding:24px 0;">Loading…</div>
</div>

<div class="site-footer" id="footer">ZL1SGS · New Zealand</div>

<script>
fetch('data.json?v=' + Date.now())
  .then(r => r.json())
  .then(d => {
    const c = document.getElementById('main-content');
    c.innerHTML = '';

    // Header
    if (d.person) {
      document.getElementById('h-callsign').textContent = d.person.name || 'Emergency Information';
      document.getElementById('footer').textContent = d.person.name || 'Emergency Information';
    }

    // ── TOURING STATUS (always first) ──
    if (d.status) {
      c.innerHTML += `<div class="section-label">Touring Status</div>`;
      c.innerHTML += `
        <div class="status-bar">
          <div class="sl">Current Location</div>
          <div class="sv">${d.status.location || '—'}</div>
          <div class="su">${d.status.updated ? 'Updated ' + d.status.updated : ''}</div>
        </div>
        <div class="plan-block">
          <div class="pl">This Week's Plan</div>
          <div class="pv">${d.status.plan || '—'}</div>
        </div>`;
    }

    if (d.trail && d.trail.length) {
      const entries = [...d.trail].reverse().slice(0,10).map(e =>
        `<div class="trail-entry"><span class="trail-date">${e.date}</span><span class="trail-place">${e.place}</span></div>`
      ).join('');
      c.innerHTML += `<div class="trail-log"><div class="tl-hdr">Recent Locations</div>${entries}</div>`;
    }

    // ── ICE (always prominent) ──
    if (d.ice && d.ice.length) {
      c.innerHTML += `<div class="section-label">In Case of Emergency</div>`;
      const items = d.ice.map(i => `
        <div class="ice-item">
          <div>
            <div class="ice-label">${i.label}</div>
            <div class="ice-name">${i.name}</div>
            <div class="ice-rel">${i.relationship}${i.location ? ' · ' + i.location : ''}</div>
            ${i.phone ? `<div class="ice-phone">${i.phone}</div>` : ''}
            ${i.email ? `<div class="ice-email">${i.email}</div>` : ''}
          </div>
          <a class="ice-call" href="tel:${i.phone}">Call</a>
        </div>`).join('');
      c.innerHTML += `<div class="ice-list">${items}</div>`;
    }

    // ── DYNAMIC SECTIONS ──
    if (d.sections && d.sections.length) {
      d.sections.forEach(sec => {
        c.innerHTML += `<div class="section-label">${sec.label}</div>`;

        // Highlight fields first
        sec.fields.filter(f => f.highlight).forEach(f => {
          c.innerHTML += `
            <div class="field-highlight">
              <div class="fl">${f.label}</div>
              <div class="fv">${f.value}</div>
            </div>`;
        });

        // Normal fields in grid
        const normal = sec.fields.filter(f => !f.highlight);
        if (normal.length) {
          const cells = normal.map(f => `
            <div class="field-cell${normal.length === 1 ? ' full' : ''}">
              <div class="fl">${f.label}</div>
              <div class="fv">${f.value}</div>
            </div>`).join('');
          c.innerHTML += `<div class="fields-grid">${cells}</div>`;
        }
      });
    }
  })
  .catch(() => {
    document.getElementById('main-content').innerHTML = '<div class="loading">Unable to load information.</div>';
  });
</script>
</body>
</html>
